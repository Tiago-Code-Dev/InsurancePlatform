version: '3.9'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: insurance-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: insurance-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"

  proposalservice:
    build:
      context: .
      dockerfile: src/ProposalService/ProposalService.Api/Dockerfile
    container_name: proposalservice
    depends_on:
      - rabbitmq
      - sqlserver
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=Insurance_Proposal;User Id=sa;Password=Your_password123;TrustServerCertificate=True
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest

  contractingservice:
    build:
      context: .
      dockerfile: src/ContractingService/ContractingService.Api/Dockerfile
    container_name: contractingservice
    depends_on:
      - rabbitmq
      - sqlserver
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=Insurance_Contracting;User Id=sa;Password=Your_password123;TrustServerCertificate=True
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
